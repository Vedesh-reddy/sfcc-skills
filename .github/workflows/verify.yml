name: verify

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: catch upstream doc/link drift

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Run all checks
        run: scripts/verify.sh --fetch
